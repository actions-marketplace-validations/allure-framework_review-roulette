name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
      - &setup-node
        name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: yarn
      - &install-deps
        run: yarn install --immutable
      - name: Run check
        run: yarn check
  build:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node
      - *install-deps
      - name: Build
        run: yarn build
      - name: Verify build
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard -- dist)"
      - name: Smoke test build
        shell: bash
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cp dist/index.js "$scratch/index.js"
          printf '{"type":"module"}\n' > "$scratch/package.json"
          status=0
          output=$(cd "$scratch" && INPUT_TOKEN=fake INPUT_REVIEWERS=alice GITHUB_EVENT_PATH= node index.js 2>&1) || status=$?
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -Fq 'A valid pull-request event context is required' <<< "$output"
          ! grep -Eq 'ERR_MODULE_NOT_FOUND|Cannot find module' <<< "$output"
  test:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup-node
      - *install-deps
      - name: Test
        run: yarn coverage
