name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  gh-release:
    name: Github release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
